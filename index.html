<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Projects</h2>
  <ul id="project-list"></ul>

  <script>
    // Replace with your Supabase values from Step 2
    const SUPABASE_URL = 'https://adicpwmcoklacgkqofri.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkaWNwd21jb2tsYWNna3FvZnJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NTc1MjMsImV4cCI6MjEwNjMzMzUyM30.gJR6tAEKqc4ZulS9X9yta4a1r3b122crLZCnYw1m4m8';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchProjects() {
      const { data, error } = await supabase.from('projects').select('*');
      if (error) console.error('Error fetching projects:', error);
      else {
        const list = document.getElementById('project-list');
        list.innerHTML = data.map(p => `<li><strong>${p.title}</strong>: ${p.description || ''}</li>`).join('');
      }
    }

    fetchProjects();
  </script>
</body>
</html>
