<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoho Projects Pro - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background:
                radial-gradient(circle at 15% 20%, rgba(239,68,68,.16), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(37,99,235,.14), transparent 30%),
                #0f172a;
        }
        .glass {
            background: rgba(255,255,255,.97);
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }
        .login-btn { transition: transform .15s ease, box-shadow .15s ease; }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(220,38,38,.25); }
        .shake { animation: shake .35s ease-in-out; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">
    <main class="w-full max-w-md">
        <section id="login-card" class="glass rounded-2xl p-8 md:p-10">
            <div class="flex justify-center mb-5">
                <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-square-poll-vertical text-red-500 text-3xl"></i>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900">Zoho Projects <span class="text-xs bg-red-600 px-2 py-1 rounded text-white uppercase">Pro</span></h1>
                <p class="text-sm text-slate-500 mt-2">Sign in to access your project portal</p>
            </div>

            <form id="login-form" class="space-y-5" novalidate>
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">User ID / Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input id="username" name="username" type="text" autocomplete="username"
                               class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500"
                               placeholder="Enter your user ID" required>
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input id="password" name="password" type="password" autocomplete="current-password"
                               class="w-full pl-10 pr-12 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500"
                               placeholder="Enter your password" required>
                        <button type="button" id="toggle-password"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700"
                                aria-label="Show password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="error-message" class="hidden rounded-lg bg-red-50 border border-red-200 text-red-700 px-4 py-3 text-sm">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i>
                    <span>Invalid user ID or password.</span>
                </div>

                <button type="submit"
                        class="login-btn w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In
                </button>
            </form>

            <div class="mt-7 pt-5 border-t border-slate-200 text-center">
                <p class="text-xs text-slate-400">Zoho Projects Replica v1.0</p>
            </div>
        </section>

        <p class="text-center text-xs text-slate-400 mt-5">
            Demo login: <strong class="text-slate-300">admin</strong> / <strong class="text-slate-300">Admin@123</strong>
        </p>
    </main>

    <script>
        // If already authenticated, go straight to the portal.
        if (sessionStorage.getItem('zp_authenticated') === 'true') {
            window.location.replace('portal.html');
        }

        const form = document.getElementById('login-form');
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const error = document.getElementById('error-message');
        const card = document.getElementById('login-card');
        const toggle = document.getElementById('toggle-password');

        toggle.addEventListener('click', () => {
            const showing = password.type === 'text';
            password.type = showing ? 'password' : 'text';
            toggle.innerHTML = showing
                ? '<i class="fa-solid fa-eye"></i>'
                : '<i class="fa-solid fa-eye-slash"></i>';
        });

        function showError(message) {
            error.querySelector('span').textContent = message;
            error.classList.remove('hidden');
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            error.classList.add('hidden');

            const user = username.value.trim();
            const pass = password.value;

            // Demo-only credentials.
            // For production, move credential validation to a server/backend.
            const validUser = 'admin';
            const validPassword = 'Admin@123';

            if (user === validUser && pass === validPassword) {
                sessionStorage.setItem('zp_authenticated', 'true');
                sessionStorage.setItem('zp_user', user);
                window.location.replace('portal.html');
            } else {
                showError('Invalid user ID or password. Please try again.');
                password.value = '';
                password.focus();
            }
        });
    </script>
</body>
</html>
